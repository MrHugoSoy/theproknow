name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sin secretos: build, tipos y pruebas corren en "modo demo" (sin variables de Supabase),
# tal como se documenta en el README. No hace falta configurar nada en el repositorio.
jobs:
  checks:
    name: Tipos, lint, pruebas unitarias y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Pruebas unitarias (vitest)
        run: npm run test

      - name: Build de producción
        run: npm run build

  e2e:
    name: Pruebas E2E (Playwright, modo demo)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
